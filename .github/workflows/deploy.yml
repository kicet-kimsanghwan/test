name: 메뉴 수집 & 대시보드 배포

on:
  schedule:
    # 카카오(정담·슈마우스): 매일 08:35부터 15분 간격으로 08:50/09:05/09:20 KST (2시간 당김)
    #   (= 전날 23:35/23:50 UTC, 00:05/00:20 UTC)
    - cron: "35 23 * * *"
    - cron: "50 23 * * *"
    - cron: "5 0 * * *"
    - cron: "20 0 * * *"
    # 네이버(4개 식당): 매주 월요일 08:05부터 20분 간격으로 08:25/08:45 KST (2시간 당김)
    #   (= 일요일 23:05/23:25/23:45 UTC — KST 월요일 새벽은 UTC로 일요일이므로 요일이 일(0)로 바뀜)
    - cron: "5 23 * * 0"
    - cron: "25 23 * * 0"
    - cron: "45 23 * * 0"
  workflow_dispatch: {}        # 수동 실행 버튼(전체 수집)
  push:
    branches: [main]           # 코드/대시보드 변경 시 재배포
    paths-ignore:
      - "public/data/**"       # 자동 수집 커밋이 재실행을 유발하지 않도록

permissions:
  contents: write              # 수집한 데이터 커밋
  pages: write                 # GitHub Pages 배포
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    # ubuntu-24.04(noble)에선 playwright 1.44가 찾는 libasound2 패키지가
    # libasound2t64로 바뀌어 --with-deps 설치가 실패함. 22.04로 고정.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 의존성 설치
        run: |
          pip install -r scraper/requirements.txt
          python -m playwright install --with-deps chromium

      - name: 수집 대상 결정
        id: target
        run: |
          case "${{ github.event.schedule }}" in
            "35 23 * * *"|"50 23 * * *"|"5 0 * * *"|"20 0 * * *") echo "value=kakao" >> "$GITHUB_OUTPUT" ;;
            "5 23 * * 0"|"25 23 * * 0"|"45 23 * * 0")              echo "value=naver" >> "$GITHUB_OUTPUT" ;;
            *)                                                    echo "value=all"   >> "$GITHUB_OUTPUT" ;;
          esac

      - name: 메뉴 스크래핑 (${{ steps.target.outputs.value }})
        run: python scraper/scrape.py ${{ steps.target.outputs.value }}
        # 일부 소스 실패해도 배포는 진행 (이전 데이터 유지)
        continue-on-error: true

      - name: 수집 데이터 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data
          if git diff --staged --quiet; then
            echo "변경 없음 — 커밋 생략"
            exit 0
          fi
          git commit -m "chore: 메뉴 자동 수집 $(date -u +%Y-%m-%d)"

          # 다른 실행이 먼저 push한 경우 rebase 후 재시도 (다른 스케줄과 겹쳐도 업데이트가 유실되지 않도록)
          for attempt in 1 2 3 4 5; do
            if git push; then
              exit 0
            fi
            echo "push 실패 (시도 $attempt) — origin/main으로 rebase 후 재시도"
            git fetch origin main
            git rebase origin/main
            sleep $((attempt * 5))
          done

          echo "::error::5회 재시도 후에도 push 실패"
          exit 1

      - name: Pages 아티팩트 업로드
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Pages 배포
        id: deployment
        uses: actions/deploy-pages@v4
